<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Analytics for the Gridiron Gurus fantasy league" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gridiron" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>Gridiron Gurus</title>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <h1 class="wordmark">Gridiron</h1>
        <button id="refresh" class="refresh" type="button" aria-label="Refresh data">
          <span class="refresh-dot" aria-hidden="true"></span>
          <span id="freshness" class="freshness">loading</span>
        </button>
      </div>
      <p id="subtitle" class="subtitle">Connecting to Sleeper…</p>
    </header>

    <main id="view" class="view" tabindex="-1">
      <div class="skeleton" role="status" aria-live="polite">
        <p>Loading league…</p>
      </div>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button type="button" data-tab="now" class="tab is-active">
        <span class="tab-label">Now</span>
      </button>
      <button type="button" data-tab="team" class="tab">
        <span class="tab-label">Team</span>
      </button>
      <button type="button" data-tab="performance" class="tab">
        <span class="tab-label">Trends</span>
      </button>
      <button type="button" data-tab="league" class="tab">
        <span class="tab-label">League</span>
      </button>
      <button type="button" data-tab="waivers" class="tab">
        <span class="tab-label">Waivers</span>
      </button>
    </nav>

    <!--
      Boot guard. If the app bundle never runs, the skeleton below would sit
      on "Loading league…" forever and look like a Sleeper problem. It is
      almost always a hosting problem: serving this source file instead of the
      built output, which leaves the module script pointing at raw TypeScript.
      Say so rather than spinning.
    -->
    <script>
      window.__ggBooted = false;

      function __ggFail(headline, detail) {
        var el = document.getElementById("view");
        if (el) {
          el.innerHTML =
            '<div class="banner is-error"><h3>' + headline + "</h3><p>" + detail + "</p></div>";
        }
      }

      // The build rewrites the module script below to a hashed asset, so a
      // literal /src/main.ts in the live DOM is proof we are being served the
      // repository source rather than the build. Report it immediately rather
      // than waiting out the timeout.
      document.addEventListener("DOMContentLoaded", function () {
        if (window.__ggBooted) return;
        if (!document.querySelector('script[src="/src/main.ts"]')) return;
        __ggFail(
          "This is the unbuilt source",
          "GitHub Pages is serving the repository root instead of the compiled " +
            "app, so the browser is being handed TypeScript it cannot run. Set " +
            "<b>Settings &rarr; Pages &rarr; Source</b> to <b>GitHub Actions</b> " +
            "(not &ldquo;Deploy from a branch&rdquo;), then re-run the deploy.",
        );
      });

      // Fallback for any other reason the bundle never runs.
      setTimeout(function () {
        if (window.__ggBooted) return;
        __ggFail(
          "The app didn't start",
          "The page loaded but its code did not. Check that GitHub Pages is " +
            "deploying from GitHub Actions rather than from a branch.",
        );
      }, 8000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
