name: Refresh league fixture

# Sleeper's API is unreachable from some sandboxed dev environments, and the
# fixture is what the UI and tests are built against. Actions runners have open
# egress, so the snapshot is refreshed here rather than by hand.

on:
  workflow_dispatch:
  push:
    # Refresh whenever the fetch layer changes, so the fixture always matches
    # the code that produced it. Ignoring fixtures/ keeps the job's own commit
    # from re-triggering it.
    paths:
      # Only what actually changes the snapshot's contents or shape. A wider
      # filter re-commits a 3.4MB fixture on unrelated edits. The workflow
      # itself is included so a schedule change re-verifies immediately.
      - "src/lib/sleeper.ts"
      - "src/lib/constants.ts"
      - "scripts/dump.ts"
      - ".github/workflows/refresh-fixture.yml"
  schedule:
    # Daily at 13:00 UTC (09:00 ET) — after overnight, before kickoff.
    # Weekly was fine in the preseason; in season the roster set, the injury
    # baseline and the rest-of-season projections all move faster than that,
    # and a five-day-old snapshot is no basis for a waiver decision.
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Dump live league state
        run: npm run dump

      - name: Report fixture size
        run: ls -lh fixtures/

      - name: Commit fixture if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/ public/players.json public/projections.json
          if git diff --staged --quiet; then
            echo "Fixture unchanged."
          else
            git commit -m "chore: refresh league fixture from live Sleeper API"
            git push origin HEAD:${{ github.ref_name }}
          fi
